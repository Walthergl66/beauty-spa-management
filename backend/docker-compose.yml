services:
  postgres:
    image: postgres:16-alpine
    container_name: oasis_spa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-oasis_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oasis_secret}
      POSTGRES_DB: ${DB_DATABASE:-oasis_spa_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - oasis_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oasis_admin} -d ${DB_DATABASE:-oasis_spa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend NestJS en SU PROPIO contenedor, independiente del de Postgres:
  # cada uno se levanta, reinicia y reconstruye por separado
  # (docker compose up -d postgres | docker compose up -d --build api).
  api:
    build: .
    container_name: oasis_spa_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de compose el host de la DB es el servicio, no localhost,
      # y el puerto interno es 5432 (el 5435 del host es solo el mapeo externo)
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  oasis_postgres_data:
    name: oasis_postgres_data
